defaults:
  - ../config/traj_envs_osm_v2@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "osm_v2_atomic_grpo"
seed: 42
logging_dir: ./output/logs
output_dir: ./output
render_save_dir: ./output/render

track_with: tensorboard
tracker_kwargs:
  log_dir: ./output/tensorboard/${exp_name}

checkpoint_config:
  type: file_system
  output_dir: ./output/checkpoints/${exp_name}

num_gpus_per_node: 8

max_steps: 200
save_steps: 25
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

rollout_batch_size: 64
val_batch_size: 64
sequence_length: 32768

advantage_clip: 0.2
ppo_epochs: 1
adv_estimator: "grpo"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0

pretrain: /data/models/qwen3-8b
reward_pretrain: /data/models/qwen3-8b

actor_train:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0.1
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    warmup_steps: 10
    lr_scheduler_type: cosine
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
  device_mapping: list(range(0,8))
  infer_batch_size: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 4096
    top_p: 1.0
    top_k: -1
    num_beams: 1
    temperature: 1.0
    num_return_sequences: 1
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: sglang
    strategy_config:
      gpu_memory_utilization: 0.55
  device_mapping: list(range(0,8))

reference:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: list(range(0,8))
  infer_batch_size: 1

reward_normalization:
  grouping: traj_group_id
  method: mean_std

# --- Environment configuration ---
osm_v2_prompt_data: ${oc.env:OSM_V2_PROMPT_DATA,examples/qwen3-8B-osm_v2_atomic/data/large_4000_500/prompt/train.jsonl}
osm_v2_scaffold_config: ${oc.env:OSM_V2_SCAFFOLD_CONFIG,examples/qwen3-8B-osm_v2_atomic/data/scaffolds/osm_v2_sandbox.yaml}
osm_v2_run_root: ${oc.env:OSM_V2_RUN_ROOT,/tmp/roll_osm_v2_atomic}

train_env_manager:
  max_env_num_per_worker: 4
  num_env_groups: 8
  group_size: 8
  tags: [OsmV2BuildPlan]
  num_groups_partition: [8]

val_env_manager:
  max_env_num_per_worker: 4
  num_env_groups: 8
  group_size: 1
  tags: [OsmV2BuildPlan]
  num_groups_partition: [8]

custom_envs:
  OsmV2BuildPlan: ${custom_env.OsmV2BuildPlan}
  OsmV2ImprovePlan: ${custom_env.OsmV2ImprovePlan}
